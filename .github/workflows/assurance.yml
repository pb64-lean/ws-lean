name: assurance

# Static source and proof-policy checks run on GitHub-hosted runners and are
# safe for untrusted pull-request revisions.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: pb64-lean/.github/.github/workflows/assurance.yml@main
